<div class="editor">
  <!-- 表示側と同じ組み合わせ（枠で切る + imageCrop の絶対配置）なので、この枠がそのままプレビューになる -->
  <div class="frame" #frame (wheel)="onWheel($event)">
    <img #image [src]="imageUrl | safe: 'resourceUrl'" [imageCrop]="crop" imageCropCovers draggable="false" />
  </div>

  <div class="side">
    <div class="hint">ドラッグで位置合わせ、ホイールで拡大</div>

    <div class="previews">
      <div class="preview-item">
        <div class="frame preview size-50">
          <img [src]="imageUrl | safe: 'resourceUrl'" [imageCrop]="crop" imageCropCovers draggable="false" />
        </div>
        <div class="preview-label">チャット</div>
      </div>
      <div class="preview-item">
        <div class="frame preview size-32">
          <img [src]="imageUrl | safe: 'resourceUrl'" [imageCrop]="crop" imageCropCovers draggable="false" />
        </div>
        <div class="preview-label">一覧</div>
      </div>
    </div>

    <div class="slider-row">
      <span class="slider-label">横位置</span>
      <input type="range" class="slider-slider" [min]="0" [max]="100" step="0.1" [value]="crop.x"
        (input)="onXInput($event)" />
      <span class="slider-value">{{crop.x}}%</span>
    </div>

    <div class="slider-row">
      <span class="slider-label">縦位置</span>
      <input type="range" class="slider-slider" [min]="0" [max]="100" step="0.1" [value]="crop.y"
        (input)="onYInput($event)" />
      <span class="slider-value">{{crop.y}}%</span>
    </div>

    <div class="slider-row">
      <span class="slider-label">拡大率</span>
      <input type="range" class="slider-slider" [min]="minScale" [max]="maxScale" step="0.05" [value]="crop.scale"
        (input)="onScaleInput($event)" />
      <span class="slider-value">{{crop.scale}}倍</span>
    </div>

    <div class="buttons">
      <button [disabled]="isDefault" (click)="reset()">リセット</button>
      <span class="spacer"></span>
      <button (click)="cancel()">キャンセル</button>
      <button (click)="submit()">OK</button>
    </div>
  </div>
</div>
