<div class="component is-3d is-pointer-events-none"
  appMovable [movable.option]="movableOption" [movable.disable]="isActive || isLock" (movable.ondragstart)="onMove()" (movable.ondragend)="onMoved()">
  <div class="is-3d" appRotable [rotable.option]="rotableOption" [rotable.disable]="isLock" (rotable.ondragstart)="onMove()" (rotable.ondragend)="onMoved()">
  <div class="component-content is-3d is-pointer-events-auto"
    [style.width.px]="width * gridSize">
    <ng-container *ngIf="!isLock">
      <div class="rotate-grab of-left-top">
        <i class="material-icons">autorenew</i>
      </div>
      <div class="rotate-grab of-right-top">
        <i class="material-icons">autorenew</i>
      </div>
    </ng-container>
    <div class="is-3d is-transition" [style.transform]="isUpright ? null : 'rotateY(90deg) rotateZ(90deg) rotateY(-90deg)'">
      <div class="upright-transform is-front is-bg-color is-bg-texture chrome-smooth-image-trick"
        [style.background-image]="'url(' + imageFile?.url + ')' | safe: 'style'" [style.width.px]="width * gridSize" [style.min-height.px]="height * gridSize">
        <div *ngIf="title.length" class="title is-black-background is-pointer-events-none">{{title}}</div>
        <div *ngIf="isLock" class="lock-icon is-right is-pointer-events-none">
          <i class="material-icons" style="display: inline;">lock</i>
        </div>
        <textarea (input)="calcFitHeight();" (mousedown)="onTextAreaMouseDown($event)" (wheel)="onTextAreaWheel($event)" #textArea class="textarea"
          [ngClass]="{'is-pointer-events-none': !isActive && !limitHeight, 'is-pointer-events-auto': isActive || limitHeight, 'is-outline-text': !isActive}"
          [style.font-size.px]="fontSize + 9" [style.overflow]="limitHeight ? 'hidden auto' : 'hidden'" [(ngModel)]="text" spellcheck="false"></textarea>
        <div *ngIf="isSelected" class="selected-highlight" [ngClass]="{'is-magnetic': isMagnetic}"></div>
      </div>
      <div class="upright-transform is-back is-bg-color is-bg-texture chrome-smooth-image-trick"
        [style.background-image]="'url(' + imageFile?.url + ')' | safe: 'style'" [style.width.px]="width * gridSize" [style.min-height.px]="height * gridSize">
        <div *ngIf="isSelected" class="selected-highlight" [ngClass]="{'is-magnetic': isMagnetic}"></div>
      </div>
    </div>
  </div>
</div>
</div>
